<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<title>HottoH</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8590c'/%3E%3Cpath d='M16 6c1 4 6 6.5 6 12a6 6 0 0 1-12 0c0-3 1.6-4.6 2.6-6 .3 2 1.2 3 2.2 3.3C14.2 12 15 9 16 6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="ui/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="HottoH">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M16 5c1.1 4.2 6.5 6.8 6.5 12.6a6.5 6.5 0 0 1-13 0c0-3.2 1.7-5 2.8-6.4.3 2.1 1.3 3.2 2.4 3.5C14 11.8 14.9 8.5 16 5z"/></svg>
      </span>
      <span class="brand-text"><strong>HottoH</strong><small id="brand-sub">—</small></span>
    </a>
    <div class="topbar-right">
      <span id="link-pill" class="pill pill-muted"><span class="dot"></span><span id="link-text">…</span></span>
      <button id="lang-btn" class="icon-btn" type="button" title="Language">FR</button>
      <button id="theme-btn" class="icon-btn" type="button" title="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <div id="banner" class="banner" hidden></div>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer">
    <span id="footer-version">hottoh_api</span>
    <a href="swagger-ui/" target="_blank" rel="noopener">Swagger UI</a>
    <a href="api-docs/openapi.json" target="_blank" rel="noopener">OpenAPI</a>
    <a href="https://github.com/jer-nz/hottoh_api" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="confirm" class="dialog">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text"></p>
  <div class="dialog-actions">
    <button type="button" class="btn btn-ghost" id="confirm-cancel"></button>
    <button type="button" class="btn btn-primary" id="confirm-ok"></button>
  </div>
</dialog>

<script src="ui/app.js"></script>
</body>
</html>
