# /etc/hottoh_api/config.ini
# Set the stove address, then start the service:
#   Alpine: rc-update add hottoh_api default && rc-service hottoh_api start
#   Debian: systemctl enable --now hottoh_api

[stove]
# IP address of the HottoH Wi-Fi module
ip = 192.168.1.100
port = 5001
# pause between two polling cycles (INF + DAT 0/1/2)
poll_interval_ms = 1000

[http_api]
ip = 0.0.0.0
port = 3000

[log]
# trace, debug, info, warn, error ("debug" logs every exchange with the stove, ~1 GiB/month)
level = info
directory = /var/log/hottoh_api
max_log_files = 7
compress = true
max_file_size_mb = 100
# statistics line in the log, in seconds (0 = disabled)
stats_interval_s = 3600


[features]
# Optional Wi-Fi module features (HTTP 403 when disabled). Reads are enabled by default;
# anything that changes the module setup, deletes data or restarts the module is not.
# GET/POST /api/chrono/schedule
chrono_schedule_read = true
chrono_schedule_write = true
# GET /api/clock; POST /api/clock also sets the stove clock
clock_read = true
clock_write = false
# GET /api/timezone; POST /api/timezone also sets the stove clock
timezone_read = true
timezone_write = false
# GET /api/datalog and /api/datalog/info; POST /api/datalog/clear deletes the history
datalog_read = true
datalog_clear = false
# GET /api/pin (cloud relay PIN); after POST /api/pin, AppFire in cloud mode must be paired again
pin_read = true
pin_write = false
# POST /api/module/restart
module_restart = false
# GET /api/wifi/scan: suspends the stove link a few seconds; the firmware may crash on WPA3 networks
wifi_scan = false
# GET /api/cloud: HottoH relay and 4-noks cloud servers
cloud_read = true
# GET /api/firmware: asks update.hottoh.it (plain HTTP) whether a newer firmware exists
firmware_update_check = true
