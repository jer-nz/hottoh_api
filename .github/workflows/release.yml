name: Release

# A `v*` tag builds and publishes the release. Run manually (Actions > Release > Run workflow)
# to build every file without publishing anything: they are kept as workflow artifacts.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.46.3
  NFPM_SHA256: 9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (static musl)
    # Native runners and the rust Alpine image: static binaries without cross-compilation tools
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -euxc '
            apk add --no-cache musl-dev curl file
            cargo build --release --locked
            file target/release/hottoh_api | grep -q "static"
          '
          cp target/release/hottoh_api hottoh_api

      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.arch }}
          path: hottoh_api
          if-no-files-found: error

  other:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            file: hottoh_api.exe
            asset: hottoh_api-windows-amd64.exe
          - runner: macos-latest
            file: hottoh_api
            asset: hottoh_api-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Rename
        shell: bash
        run: cp "target/release/${{ matrix.file }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Packages and release
    needs: [linux, other]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: bin

      - name: Install nFPM
        run: |
          curl -sSfL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf nfpm.tar.gz -C /usr/local/bin nfpm

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            chmod +x "bin/bin-linux-$arch/hottoh_api"
            packaging/package.sh "$VERSION" "$arch" "bin/bin-linux-$arch/hottoh_api" dist
          done
          cp bin/bin-hottoh_api-windows-amd64.exe/* bin/bin-hottoh_api-macos-arm64/* dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Test packages (amd64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          packaging/test-install.sh "dist/hottoh-api_${VERSION}_amd64.apk"
          packaging/test-install.sh "dist/hottoh-api_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::no section for $VERSION in CHANGELOG.md"
            exit 1
          fi

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: hottoh_api ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
