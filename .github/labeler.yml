# Labels added to pull requests according to the modified files (actions/labeler v5 format)

documentation:
  - changed-files:
      - any-glob-to-any-file: ['README.md', 'LICENSE', '**/*.md']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**/*', '.rustfmt.toml']

packaging:
  - changed-files:
      - any-glob-to-any-file: ['packaging/**/*']

source:
  - changed-files:
      - any-glob-to-any-file: ['src/**/*']

config:
  - changed-files:
      - any-glob-to-any-file: ['config.ini', 'Cargo.toml']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['Cargo.toml', 'Cargo.lock']
